<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>term.ai</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" id="hl-theme" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<style>
:root{--bg:#0d0f12;--fg:#d7dae0;--dim:#8b949e;--acc:#7ee787;--err:#ff7b72;--line:#262b33;--panel:#14171c;--code:#0a0c0f;
  --font:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
[data-theme=light]{--bg:#fafafa;--fg:#1f2328;--dim:#57606a;--acc:#1a7f37;--err:#cf222e;--line:#d0d7de;--panel:#fff;--code:#f3f4f6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--font);-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;height:var(--app-h,100dvh);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0 .6em;min-height:36px;cursor:pointer;border-radius:4px}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.dim{color:var(--dim)}.err{color:var(--err)}

/* 状态栏 */
#bar{display:flex;align-items:center;gap:.1rem;padding:env(safe-area-inset-top) .2rem 0;border-bottom:1px solid var(--line);white-space:nowrap}
#bar .ico{min-width:44px;min-height:44px;font-size:17px}
#bar .st{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
#st-model{color:var(--acc);max-width:38vw}
#st-web[aria-pressed=true]{color:var(--acc)}
#st-tok{margin-left:auto;padding:0 .3em}

/* 消息区 */
#log{flex:1;overflow-y:auto;padding:.8rem .9rem 1rem;overscroll-behavior:contain}
.welcome{margin-top:20vh;text-align:center}
.welcome .logo{color:var(--acc);font-size:18px;margin-bottom:.4rem}
.msg{margin:0 0 1.1rem}
.u{display:flex;gap:1ch;color:var(--acc)}
.u .txt{white-space:pre-wrap;word-break:break-word;color:var(--fg);min-width:0}
.md{word-break:break-word}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md table,.md blockquote{margin:.5em 0}
.md ul,.md ol{padding-left:2.5ch}
.md h1,.md h2,.md h3,.md h4{font-size:1em;margin:.9em 0 .3em}
.md h1::before{content:"# ";color:var(--dim)}.md h2::before{content:"## ";color:var(--dim)}.md h3::before{content:"### ";color:var(--dim)}
.md a{color:var(--acc)}
.md :not(pre)>code{background:var(--code);padding:.1em .35em;border-radius:3px}
.md blockquote{border-left:2px solid var(--line);padding-left:1ch;color:var(--dim)}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:.2em .6em}
.md hr{border:0;border-top:1px dashed var(--line)}
.streaming .md::after{content:"▍";color:var(--acc);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.streaming .md::after{animation:none}}

/* 代码块 */
.cb{border:1px solid var(--line);border-radius:4px;margin:.6em 0;overflow:hidden}
.cb-bar{display:flex;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.cb-bar span{padding:0 .8em;margin-right:auto}
.cb-bar button{color:var(--dim);min-height:34px}
.cb pre{margin:0;overflow-x:auto;background:var(--code)}
.cb pre code,.cb pre code.hljs{display:block;padding:.7em .8em;background:none;font-size:13px;line-height:1.5}

/* 来源 & 操作 */
.src{margin:.5em 0 0;padding-left:3ch;font-size:12px}
.src li{margin:.25em 0}
.src a{color:var(--fg)}
.snip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{white-space:pre-wrap;color:var(--dim);margin:0;font:inherit}
.acts{display:flex;gap:.1rem;margin-top:.15rem}
.acts button{font-size:12px;color:var(--dim);min-height:32px;padding:0 .55em}

/* 底部输入 */
#dock{position:relative;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
#chips{display:flex;gap:.4rem;overflow-x:auto;padding:.45rem .6rem 0;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--dim);min-height:32px;padding:0 .9em}
#chips button[aria-pressed=true]{color:var(--acc);border-color:var(--acc)}
#form{display:flex;align-items:flex-end;gap:.5rem;padding:.4rem .6rem .55rem}
.prompt{color:var(--acc);line-height:40px}
#input{flex:1;min-width:0;resize:none;border:0;background:none;color:var(--fg);font:inherit;font-size:16px;line-height:1.5;padding:8px 0;outline:none}
#form:focus-within{box-shadow:inset 0 -1px 0 var(--acc)}
#send{min-width:44px;min-height:40px;border:1px solid var(--line);color:var(--acc);font-size:16px}
#send.busy{color:var(--err);border-color:var(--err)}
#cmds{position:absolute;left:.6rem;right:.6rem;bottom:100%;margin-bottom:.3rem;max-height:45vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:4px;z-index:5}
#cmds button{display:block;width:100%;text-align:left;min-height:44px;padding:0 .8em;border-radius:0}
#cmds button+button{border-top:1px solid var(--line)}
#cmds b{color:var(--acc);font-weight:normal}

/* 会话抽屉 */
#scrim{position:fixed;inset:0;background:#0009;z-index:10}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);z-index:20;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .2s;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#drawer.open{transform:none}
#drawer .row{padding:.5rem}
#d-list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
#d-list li{display:flex;border-top:1px solid var(--line)}
#d-list li.on .d-open span{color:var(--acc)}
#d-list .d-open{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;padding:.5em .8em;min-height:52px}
#d-list .d-open span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#d-list li>button:not(.d-open){min-width:44px;color:var(--dim)}
#d-list .empty{padding:1rem;border:0}

/* 表单 & 弹窗 */
.row{display:flex;gap:.5rem;align-items:center}
.row>label,.row>select,.row>input{flex:1;min-width:0}
input[type=search],dialog input,dialog select,dialog textarea{display:block;width:100%;margin-top:.2rem;background:var(--bg);color:var(--fg);
  border:1px solid var(--line);border-radius:4px;padding:.5em;font:inherit;font-size:16px}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:0;width:min(94vw,520px);max-height:90dvh}
dialog::backdrop{background:#0009}
#set-form{padding:1rem}
#set-form h2{font-size:1em;margin:0 0 .8rem;color:var(--acc)}
fieldset{border:1px solid var(--line);border-radius:4px;margin:0 0 .8rem;padding:.5rem .8rem .7rem}
legend{color:var(--acc);padding:0 .4em}
label{display:block;font-size:12px;color:var(--dim);margin:.45rem 0}
.row>button{border:1px solid var(--line);min-width:44px;min-height:40px}
.check{display:flex;gap:.6em;align-items:center;color:var(--fg);font-size:14px}
.check input{width:auto;margin:0}
.warn{font-size:12px;color:var(--dim);margin:.2rem 0 1rem}
.end{justify-content:flex-end;flex-direction:row-reverse}
.end button{flex:none;min-width:88px}
.primary{color:var(--acc);border-color:var(--acc)!important}
#preview{width:96vw;height:90dvh;max-width:none}
#preview[open]{display:flex;flex-direction:column}
#preview .row{padding:.2rem .2rem .2rem .8rem;justify-content:space-between;font-size:12px}
#pv-frame{flex:1;width:100%;border:0;background:#fff}

#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;
  background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:.4em .9em;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<header id="bar">
  <button id="btn-menu" class="ico" aria-label="会话列表">≡</button>
  <button id="st-model" class="st" aria-label="切换模型">-</button>
  <button id="st-web" class="st" aria-pressed="false" aria-label="联网搜索开关">web:off</button>
  <span id="st-tok" class="st">0 tok</span>
  <button id="btn-theme" class="ico" aria-label="切换主题">◐</button>
  <button id="btn-set" class="ico" aria-label="设置">⚙</button>
</header>

<main id="log" aria-live="polite" aria-label="对话记录"></main>

<footer id="dock">
  <div id="cmds" role="listbox" aria-label="命令补全" hidden></div>
  <div id="chips" role="toolbar" aria-label="快捷操作">
    <button type="button" data-chip="web" aria-pressed="false">联网</button>
    <button type="button" data-chip="code" aria-pressed="false">代码模式</button>
    <button type="button" data-chip="model">模型</button>
    <button type="button" data-chip="attach">附上次代码</button>
    <button type="button" data-chip="slash">/ 命令</button>
    <button type="button" data-chip="new">新会话</button>
  </div>
  <form id="form" autocomplete="off">
    <span class="prompt" aria-hidden="true">&gt;</span>
    <textarea id="input" rows="1" placeholder="输入消息，/ 查看命令" aria-label="消息输入"></textarea>
    <button id="send" type="submit" aria-label="发送">↵</button>
  </form>
</footer>

<div id="scrim" hidden></div>
<aside id="drawer" aria-label="会话列表">
  <div class="row">
    <input id="d-q" type="search" placeholder="搜索会话" aria-label="搜索会话">
    <button id="d-new" aria-label="新会话">+</button>
  </div>
  <ul id="d-list"></ul>
</aside>

<dialog id="settings" aria-labelledby="set-title">
  <form method="dialog" id="set-form">
    <h2 id="set-title">设置</h2>
    <fieldset>
      <legend>模型</legend>
      <div class="row">
        <select id="p-sel" aria-label="当前服务商"></select>
        <button type="button" id="p-add" aria-label="新增服务商">+</button>
        <button type="button" id="p-del" aria-label="删除服务商">−</button>
      </div>
      <label>套用预设
        <select id="p-tpl">
          <option value="">选择…</option>
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
          <option value="deepseek">DeepSeek</option>
          <option value="openrouter">OpenRouter</option>
          <option value="ollama">Ollama（本地）</option>
        </select>
      </label>
      <label>名称<input id="p-name"></label>
      <label>接口类型
        <select id="p-type"><option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic</option></select>
      </label>
      <label>Base URL<input id="p-base" inputmode="url" placeholder="https://api.openai.com/v1"></label>
      <label>API Key<input id="p-key" type="password" autocomplete="off"></label>
      <label>模型名<input id="p-model" placeholder="如 gpt-4o-mini"></label>
    </fieldset>

    <fieldset>
      <legend>搜索</legend>
      <label>引擎
        <select id="s-type">
          <option value="none">不启用</option>
          <option value="tavily">Tavily</option>
          <option value="brave">Brave（需代理）</option>
          <option value="searxng">SearXNG（自建）</option>
        </select>
      </label>
      <label>地址（仅 SearXNG）<input id="s-endpoint" inputmode="url" placeholder="https://searx.example.com"></label>
      <label>API Key<input id="s-key" type="password" autocomplete="off"></label>
    </fieldset>

    <fieldset>
      <legend>生成</legend>
      <label>System Prompt<textarea id="g-sys" rows="3"></textarea></label>
      <div class="row">
        <label>Temperature<input id="g-temp" type="number" step="0.1" min="0" max="2"></label>
        <label>Max tokens<input id="g-max" type="number" min="1" step="1"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>代理（可选）</legend>
      <label>Worker URL<input id="x-url" inputmode="url" placeholder="https://xxx.workers.dev"></label>
      <label>访问令牌<input id="x-token" type="password" autocomplete="off"></label>
    </fieldset>

    <label class="check"><input type="checkbox" id="remember"> 在本机保存 API Key</label>
    <p class="warn">Key 存在浏览器本地，能使用这台设备的人可以读到。不勾选则关闭标签页后清除。更安全的做法是把 Key 放在代理 Worker 里。</p>

    <div class="row end">
      <button value="save" class="primary">保存</button>
      <button value="cancel">取消</button>
    </div>
  </form>
</dialog>

<dialog id="preview" aria-label="HTML 预览">
  <div class="row"><span class="dim">preview · sandbox</span><button id="pv-close">close</button></div>
  <iframe id="pv-frame" sandbox="allow-scripts allow-forms allow-modals" title="代码预览"></iframe>
</dialog>

<div id="toast" role="status"></div>

<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
